name: Jekyll PR Previews

on:
  pull_request:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions: read-all

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      pages: write

    outputs:
      pr_path: ${{ steps.setpath.outputs.pr_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
          cache-version: 0
      # Determine output folder: main → root, PR → /pr-<number>/
      - name: Determine output path
        id: setpath
        run: |
          echo "pr_path=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
      # Build Jekyll
      - name: Build Jekyll
        run: |
          DEST="./_site/${{ steps.setpath.outputs.pr_path }}"
          mkdir -p "$DEST"
          bundle exec jekyll build --destination "$DEST" --trace --baseurl "${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/"
      # Upload the artifact for deployment
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write
      pull-requests: write

    # Deploy for both PRs and main
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Comment PR preview URL
      - name: Comment PR Preview URL
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🔍 **Unique Jekyll PR Preview Ready**

            Preview URL:  
            **https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/**
